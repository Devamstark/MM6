<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .header {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            line-height: 1;
        }

        .logo-tm {
            font-size: 14px;
            vertical-align: top;
            margin-left: 2px;
        }

        .logo-est {
            display: block;
            font-size: 10px;
            letter-spacing: 0.4em;
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 12px;
            color: #64748b;
            background-color: #f1f5f9;
        }

        .button {
            display: inline-block;
            background-color: #4f46e5;
            color: #ffffff !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        .highlight {
            color: #4f46e5;
            font-weight: bold;
        }

        .order-summary {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="https://smartshop1.us" class="logo">
                SMARTSHOP<span class="logo-tm">TM</span>
                <span class="logo-est">EST. 2026</span>
            </a>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 SmartShop Inc. | Quality Fashion & Lifestyle</p>
            <p>434 Main St, New Rochelle, NY 10801</p>
            <p><a href="https://smartshop1.us/page/privacy-policy" style="color: #64748b;">Privacy Policy</a> | <a
                    href="https://smartshop1.us/page/terms-of-service" style="color: #64748b;">Terms of Service</a></p>
        </div>
    </div>
</body>

</html>
