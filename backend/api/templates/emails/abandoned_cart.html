<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <tr>
                        <td style="background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); padding: 32px 24px; text-align: center;">
                            <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 0.1em; color: #ffffff;">SMARTSHOP</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 32px; text-align: left;">
                            <h2 style="font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 16px;">Did you forget something, {{ user.first_name|default:user.username }}?</h2>
                            <p style="font-size: 16px; color: #4B5563; line-height: 1.6; margin-bottom: 24px;">
                                We noticed you left some great items in your cart. They are still waiting for you!
                            </p>
                            
                            <!-- Cart Items -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                                {% for item in cart.items.all %}
                                <tr>
                                    <td style="padding: 12px 0; border-bottom: 1px solid #E5E7EB;">
                                        <p style="margin: 0; font-weight: 600; color: #111827;">{{ item.product.name }}</p>
                                        <p style="margin: 0; font-size: 14px; color: #6B7280;">Qty: {{ item.quantity }}</p>
                                    </td>
                                </tr>
                                {% endfor %}
                            </table>

                            <div style="text-align: center;">
                                <a href="https://smartshop1.us/cart" style="display: inline-block; background-color: #4F46E5; color: #ffffff; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px;">
                                    Return to Checkout
                                </a>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
