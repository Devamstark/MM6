<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <tr>
                        <td
                            style="background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%); padding: 32px 24px; text-align: center;">
                            <h1
                                style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 0.1em; color: #ffffff;">
                                SMARTSHOP</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 32px; text-align: center;">
                            <h2 style="font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 16px;">We still
                                have your cart!</h2>
                            <p style="font-size: 16px; color: #4B5563; line-height: 1.6; margin-bottom: 24px;">
                                Come back and complete your purchase. As a special gift, here's 10% off your entire
                                order.
                            </p>

                            <!-- Discount Code Box -->
                            <table align="center" width="200" cellpadding="0" cellspacing="0"
                                style="margin-bottom: 32px;">
                                <tr>
                                    <td
                                        style="border: 2px dashed #8B5CF6; border-radius: 8px; padding: 16px 32px; background-color: #F5F3FF;">
                                        <p
                                            style="margin: 0; font-size: 12px; color: #6B7280; font-weight: 600; text-transform: uppercase;">
                                            Use Code</p>
                                        <p
                                            style="margin: 8px 0 0 0; font-size: 24px; font-weight: 900; color: #8B5CF6; letter-spacing: 0.05em;">
                                            {{ discount_code }}</p>
                                    </td>
                                </tr>
                            </table>

                            <a href="https://smartshop1.us/cart"
                                style="display: inline-block; background-color: #EC4899; color: #ffffff; padding: 16px 40px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px;">
                                Claim Your Discount
                            </a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
