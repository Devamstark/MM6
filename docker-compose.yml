version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smartshop_db
      - POSTGRES_USER=smartshop_user
      - POSTGRES_PASSWORD=smartshop123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartshop_user -d smartshop_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    environment:
      - SECRET_KEY=django-insecure-prod-key-12345
      - DEBUG=False
      - ALLOWED_HOSTS=smartshop1.us,www.smartshop1.us,backend
      - DATABASE_URL=postgres://smartshop_user:smartshop123@db:5432/smartshop_db
      - CORS_ALLOWED_ORIGINS=https://smartshop1.us,https://www.smartshop1.us
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.smartshop1.us`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=https://api.smartshop1.us
    restart: always
    volumes:
      - frontend_build:/data
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`smartshop1.us`) || Host(`www.smartshop1.us`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  adminer:
    image: adminer:latest
    restart: always
    networks:
      - dokploy-network
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.smartshop1.us`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  backend_static:
  backend_media:
  frontend_build:


networks:
  dokploy-network:
    external: true
