version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smartshop_db
      - POSTGRES_USER=smartshop_user
      - POSTGRES_PASSWORD=smartshop123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartshop_user -d smartshop_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    environment:
      - SECRET_KEY=django-insecure-prod-key-12345
      - DEBUG=False
      - ALLOWED_HOSTS=smartshop1.us,www.smartshop1.us,backend
      - DATABASE_URL=postgres://smartshop_user:smartshop123@db:5432/smartshop_db
      - CORS_ALLOWED_ORIGINS=https://smartshop1.us,https://www.smartshop1.us
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
    restart: always
    volumes:
      - frontend_build:/data

  caddy:
    image: caddy:2-alpine
    restart: always
    # No port bindings - Traefik (Dokploy) handles ports 80 and 443
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smartshop.rule=Host(`smartshop1.us`) || Host(`www.smartshop1.us`)"
      - "traefik.http.routers.smartshop.entrypoints=websecure"
      - "traefik.http.routers.smartshop.tls.certresolver=letsencrypt"
      - "traefik.http.services.smartshop.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"
    networks:
      - dokploy-network
      - default
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - backend_static:/srv/staticfiles
      - backend_media:/srv/media
      - frontend_build:/srv
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_static:
  backend_media:
  frontend_build:


networks:
  dokploy-network:
    external: true
  default:
    driver: bridge
