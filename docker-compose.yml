services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    volumes:
      - backend_static:/app/backend/staticfiles
      - backend_media:/app/backend/media
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SECURE_PROXY_SSL_HEADER=${SECURE_PROXY_SSL_HEADER}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SERVER_EMAIL=${SERVER_EMAIL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SLACK_SECURITY_WEBHOOK=${SLACK_SECURITY_WEBHOOK}
      - SLACK_ORDERS_WEBHOOK=${SLACK_ORDERS_WEBHOOK}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    depends_on:
      - db
      - redis
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.2'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.smartshop1.us`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.security-headers.headers.referrerpolicy=same-origin"
      - "traefik.http.middlewares.security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stspreload=true"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Content-Security-Policy=upgrade-insecure-requests; block-all-mixed-content;"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Permissions-Policy=camera=(), microphone=(), geolocation=(), browsing-topics=()"
      - "traefik.http.routers.backend.middlewares=security-headers,noindex-headers"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.routers.backend-http.rule=Host(`api.smartshop1.us`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-https"
      - "traefik.http.middlewares.noindex-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - SLACK_SECURITY_WEBHOOK=${SLACK_SECURITY_WEBHOOK}
      - SLACK_ORDERS_WEBHOOK=${SLACK_ORDERS_WEBHOOK}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    depends_on:
      - db
      - redis
    command: celery -A core worker --loglevel=info
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: always
    volumes:
      - frontend_build:/data
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`smartshop1.us`) || Host(`www.smartshop1.us`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Security Headers
      - "traefik.http.routers.frontend.middlewares=security-headers"
      # HTTPS Redirect
      - "traefik.http.routers.frontend-http.rule=Host(`smartshop1.us`) || Host(`www.smartshop1.us`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=redirect-https"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network

  adminer:
    image: adminer:latest
    restart: always
    networks:
      - dokploy-network
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.smartshop1.us`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.routers.adminer.middlewares=security-headers,noindex-headers"

  filebrowser:
    image: filebrowser/filebrowser:latest
    user: 0:0 # Run as root to avoid permission issues with the host mount
    restart: always
    ports:
      - "2025:8080"
    volumes:
      - backend_media:/srv
      - filebrowser_data:/database
    command: [ "-a", "0.0.0.0", "-p", "8080", "-d", "/database/filebrowser.db", "--root", "/srv" ]
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.smartshop1.us`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=letsencrypt"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=8080"
      - "traefik.http.routers.filebrowser.middlewares=security-headers,noindex-headers"

  roundcube:
    image: roundcube/roundcubemail:latest
    restart: always
    ports:
      - "8025:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://us2.imap.mailhostbox.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://us2.smtp.mailhostbox.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roundcube.rule=Host(`mail.smartshop1.us`)"
      - "traefik.http.routers.roundcube.entrypoints=websecure"
      - "traefik.http.routers.roundcube.tls.certresolver=letsencrypt"
      - "traefik.http.services.roundcube.loadbalancer.server.port=80"
      - "traefik.http.routers.roundcube.middlewares=security-headers,noindex-headers"

volumes:
  postgres_data:
  backend_static:
  backend_media:
  frontend_build:
  minio_data:
  filebrowser_data:


networks:
  dokploy-network:
    external: true
