version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smartshop_db
      - POSTGRES_USER=smartshop_user
      - POSTGRES_PASSWORD=smartshop123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartshop_user -d smartshop_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    environment:
      - SECRET_KEY=django-insecure-prod-key-12345
      - DEBUG=False
      - ALLOWED_HOSTS=smartshop.net,www.smartshop.net,157.90.149.223,localhost,backend
      - DATABASE_URL=postgres://smartshop_user:smartshop123@db:5432/smartshop_db
      - CORS_ALLOWED_ORIGINS=https://smartshop.net,https://www.smartshop.net,http://157.90.149.223,http://localhost
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://157.90.149.223/api
    restart: always
    ports:
      - "80:80"
    volumes:
      - backend_static:/backend_static
      - backend_media:/backend_media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_static:
  backend_media:
