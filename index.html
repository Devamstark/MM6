<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Discover the latest trends in fashion at SmartShop. Shop men's clothing, women's fashion, accessories and more. Free shipping on orders over $100." />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="blS6P0LrFmy_sJBDFYOk1oDNXxEirHq5QjABiIx0vqs" />

    <link rel="canonical" href="https://smartshop1.us/" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Robots meta tag - allow all search engines -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / SEO Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartshop1.us/" />
    <meta property="og:title" content="SmartShop — Premium Fashion for Men, Women & Accessories" />
    <meta property="og:description"
        content="Discover the latest trends in fashion at SmartShop. Shop men's clothing, women's fashion, accessories and more." />
    <meta property="og:image" content="https://smartshop1.us/smartshop-logo.png" />

    <title>SmartShop — Premium Fashion for Men, Women & Accessories</title>

    <!-- DNS prefetch for our own API server only — no Google needed -->
    <link rel="dns-prefetch" href="https://smartshop1.us" />
    <link rel="dns-prefetch" href="https://api.smartshop1.us" />

    <!-- Preloading is now handled dynamically by the build tool or CSS -->


    <style>
        /* =====================================================
           SELF-HOSTED FONTS — zero Google, zero external call
           ===================================================== */

        /* Inter — body / UI text */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/inter-400.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/fonts/inter-500.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/inter-600.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/inter-700.woff2') format('woff2');
        }

        /* Outfit — headings / display (variable font, covers weight 100–900) */
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/outfit-var.woff2') format('woff2-variations');
        }

        /* =====================================================
           CRITICAL BASE STYLES — page never looks unstyled
           ===================================================== */
        body {
            margin: 0;
            background: #fff;
            /* System font stack while Inter loads (font-display:swap) */
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #root {
            min-height: 100vh;
        }

        /* Hero shimmer skeleton — prevents layout shift while JS hydrates */
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>

    <!-- Schema.org Structured Data for OnlineStore -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "SmartShop",
      "url": "https://smartshop1.us",
      "logo": "https://smartshop1.us/smartshop-logo.png",
      "description": "Premium fashion for men, women & accessories. Free shipping on orders over $100.",
      "priceRange": "$$",
      "currenciesAccepted": "USD",
      "paymentAccepted": "Credit Card, PayPal, Apple Pay, Google Pay",
      "shippingDetails": {
        "@type": "OfferShippingDetails",
        "shippingRate": {
          "@type": "MonetaryAmount",
          "value": "0",
          "currency": "USD"
        },
        "deliveryTime": {
          "@type": "ShippingDeliveryTime",
          "handlingTime": {
            "@type": "QuantitativeValue",
            "minValue": 1,
            "maxValue": 3,
            "unitCode": "DAY"
          },
          "transitTime": {
            "@type": "QuantitativeValue",
            "minValue": 2,
            "maxValue": 7,
            "unitCode": "DAY"
          }
        }
      },
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Fashion Products",
        "itemListElement": [
          {
            "@type": "OfferCatalog",
            "name": "Men's Clothing",
            "url": "https://smartshop1.us/products?category=Men"
          },
          {
            "@type": "OfferCatalog",
            "name": "Women's Clothing",
            "url": "https://smartshop1.us/products?category=Women"
          },
          {
            "@type": "OfferCatalog",
            "name": "Accessories",
            "url": "https://smartshop1.us/products?category=Accessories"
          }
        ]
      }
    }
    </script>

    <!-- BreadcrumbList Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://smartshop1.us/"
        }
      ]
    }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SmartShop",
      "url": "https://smartshop1.us",
      "logo": "https://smartshop1.us/smartshop-logo.png",
      "sameAs": [
        "https://www.facebook.com/smartshop1",
        "https://www.instagram.com/smartshop1",
        "https://twitter.com/smartshop1"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@smartshop1.us"
      }
    }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
